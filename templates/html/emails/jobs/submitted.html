<!-- layout.html -->
{{define "layout"}}
<!doctype html>
<html>
  <body>
    <p>Hi {{.Name}},</p>
    <p>
      Your <strong style="text-transform: capitalize">{{.Job.Type}}</strong> job
      was submitted on {{.Time}}. You will be notified once the job is
      processed.
    </p>

    <p>Job Reference: <strong>{{.Job.ID}}</strong></p>

    {{template "footer" . }}
  </body>
</html>
{{end}}
